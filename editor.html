<title>ivite Layout Editor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Editor tata letak undangan ivite — susun aset watercolor & teks tiap seksi, lalu simpan.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600&display=swap">
<style>
/* Layout: topbar + 3 kolom (palet | panggung | properti); di layar sempit panel jadi laci. */
:root{
  --bg:#ece7df; --panel:#f7f4ee; --panel-2:#fffdf9; --fg:#2a2620; --muted:#6c6457;
  --line:#ddd5c6; --accent:#9a6b2f; --accent-fg:#fff; --sel:#C9A24B; --danger:#9a3b2f;
  --ui:system-ui,-apple-system,'Segoe UI',sans-serif;
  --display:'Cormorant Garamond',Georgia,serif; --name:'Cormorant','Cormorant Garamond',serif; --body:'Cormorant Garamond',Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17150f; --panel:#201d16; --panel-2:#272318; --fg:#efe9dd; --muted:#a79e8c;
  --line:#352f22; --accent:#d8b36a; --accent-fg:#201d16; --sel:#E2C57F; --danger:#e07a63; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#17150f; --panel:#201d16; --panel-2:#272318; --fg:#efe9dd; --muted:#a79e8c;
  --line:#352f22; --accent:#d8b36a; --accent-fg:#201d16; --sel:#E2C57F; --danger:#e07a63; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;overflow:hidden}
.app{display:grid;grid-template-rows:auto 1fr;height:100%}

/* topbar */
.top{display:flex;align-items:center;gap:8px;padding:10px max(16px,env(safe-area-inset-left,0px));padding-top:max(10px,env(safe-area-inset-top,0px));background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-family:var(--name);font-weight:600;font-size:18px;letter-spacing:.02em;margin-right:4px}
.brand small{font-family:var(--ui);font-weight:400;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);display:block;margin-top:-2px}
.tabs{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;padding:2px}
.tab{flex:0 0 auto;padding:6px 12px;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);border-radius:999px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn{padding:7px 12px;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);border-radius:8px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.icon{padding:6px 9px}
.only-mobile{display:none}

/* main 3-col */
.main{display:grid;grid-template-columns:186px 1fr 248px;min-height:0}
.col{min-height:0;overflow:auto;background:var(--panel)}
.col.left{border-right:1px solid var(--line)}
.col.right{border-left:1px solid var(--line)}
.col h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:14px 12px 8px;font-weight:600}
.pal{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px 16px}
.pal button{aspect-ratio:1;border:1px solid var(--line);background:var(--panel-2);border-radius:10px;cursor:pointer;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;overflow:hidden}
.pal button:hover{border-color:var(--accent)}
.pal img{max-width:100%;max-height:40px;object-fit:contain;pointer-events:none}
.pal span{font-size:9.5px;color:var(--muted);text-align:center;line-height:1.1}
.pal .addtext{aspect-ratio:auto;grid-column:1/-1;flex-direction:row;gap:8px;padding:10px;font-size:13px;color:var(--fg)}
.pal .addtext b{font-size:18px;color:var(--accent)}

/* stage */
.stagewrap{overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:22px 16px 60px;background:
  repeating-conic-gradient(var(--line) 0% 25%, transparent 0% 50%) 50%/22px 22px;}
.stagewrap{background-color:var(--bg)}
.stage-outer{filter:drop-shadow(0 10px 30px rgba(0,0,0,.18));border-radius:18px;overflow:hidden;background:#fff}
.stage{position:relative;width:390px;transform-origin:top center}
.sec{position:relative;width:390px;overflow:hidden}
.layer{position:absolute;will-change:transform}
.layer img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.layer.flip img{transform:scaleX(-1)}
.ltext{white-space:pre-wrap;line-height:1.08}
.ltext.pill{background:#2a1f16;color:#f4e9d5;border-radius:3px;padding:12px 14px}
.layer.sel{outline:1.5px solid var(--sel);outline-offset:1px}
.handle{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--sel);border:2px solid #fff;right:-9px;bottom:-9px;cursor:nwse-resize;touch-action:none;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.previewing .handle,.previewing .layer.sel{outline:none;display:revert}
.previewing .handle{display:none}

/* props */
.props{padding:4px 12px 40px}
.row{display:flex;align-items:center;gap:8px;margin:9px 0}
.row label{font-size:11px;color:var(--muted);flex:0 0 58px;text-transform:uppercase;letter-spacing:.04em}
.row input[type=number],.row input[type=text],.row select,.props textarea{flex:1;min-width:0;padding:6px 8px;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);border-radius:7px;font-size:13px;font-family:var(--ui)}
.props textarea{width:100%;min-height:60px;resize:vertical;font-family:var(--body);font-size:15px}
.row input[type=range]{flex:1}
.row input[type=color]{width:38px;height:30px;padding:0;border:1px solid var(--line);border-radius:7px;background:none}
.seg{display:flex;gap:4px;flex:1}
.seg button{flex:1;padding:6px;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);border-radius:7px;cursor:pointer;font-size:12px}
.seg button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.zbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.empty{color:var(--muted);font-size:12.5px;padding:18px 12px;line-height:1.5}
.danger{color:var(--danger);border-color:var(--danger)}
.hint{font-size:11px;color:var(--muted);padding:0 12px 14px;line-height:1.5}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:520px;width:100%;max-height:80vh;display:flex;flex-direction:column;gap:10px}
.modal h2{margin:0;font-size:16px;font-family:var(--name)}
.modal textarea{width:100%;flex:1;min-height:220px;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);border-radius:8px;padding:10px;font-family:ui-monospace,monospace;font-size:12px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* mode undangan (render nyata) */
#invite{position:fixed;inset:0;z-index:60;overflow-y:auto;overflow-x:hidden;background:#EADCC0;-webkit-overflow-scrolling:touch}
#invite .wrap{display:flex;flex-direction:column;align-items:center;min-height:100%}
#invite .rsec{position:relative;overflow:hidden;flex:0 0 auto}
#invite .rstage{position:relative;width:390px;transform-origin:top left}
#invite .layer img{width:100%;height:auto;display:block}
#invite .ltext{white-space:pre-wrap;line-height:1.08}
#invite .ltext.pill{background:#2a1f16;color:#f4e9d5;border-radius:3px;padding:12px 14px}
.invedit{position:fixed;top:max(12px,env(safe-area-inset-top,0px));right:12px;z-index:62;box-shadow:0 2px 10px rgba(0,0,0,.3)}

@media (max-width:820px){
  .main{grid-template-columns:1fr}
  .col.left,.col.right{position:fixed;top:0;bottom:0;width:260px;max-width:84vw;z-index:40;transition:transform .22s ease;padding-top:max(10px,env(safe-area-inset-top,0px))}
  .col.left{left:0;transform:translateX(-102%)}
  .col.right{right:0;transform:translateX(102%)}
  .col.left.open{transform:none;box-shadow:8px 0 30px rgba(0,0,0,.3)}
  .col.right.open{transform:none;box-shadow:-8px 0 30px rgba(0,0,0,.3)}
  .only-mobile{display:inline-flex}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:39}
}
@media (prefers-reduced-motion:reduce){.col.left,.col.right{transition:none}}
</style>

<div class="app">
  <div class="top">
    <div class="brand">ivite<small>Editor</small></div>
    <button class="btn icon only-mobile" id="mPal" title="Aset">▦</button>
    <div class="tabs" id="tabs"></div>
    <button class="btn icon only-mobile" id="mProp" title="Atur">⚙</button>
    <button class="btn sm primary" id="btnInvite">Undangan</button>
    <button class="btn sm" id="btnPreview">Pratinjau</button>
    <button class="btn sm" id="btnJson">Layout</button>
  </div>
  <div class="main">
    <aside class="col left" id="palCol">
      <h3>Tambah Elemen</h3>
      <div class="pal" id="pal"></div>
      <h3>Seksi</h3>
      <div class="props" style="padding-top:0">
        <div class="row"><label>Latar</label><input type="color" id="secBg"></div>
        <div class="row"><label>Tinggi</label><input type="number" id="secH" min="240" max="2000" step="10"></div>
        <div class="zbtns"><button class="btn sm" id="secAdd">+ Seksi</button><button class="btn sm danger" id="secDel">Hapus Seksi</button></div>
      </div>
      <p class="hint">Klik aset untuk menaruh di seksi aktif. Lalu seret di kanvas, tarik titik emas untuk ubah ukuran.</p>
    </aside>

    <div class="stagewrap" id="stagewrap">
      <div class="stage-outer"><div class="stage" id="stage"></div></div>
    </div>

    <aside class="col right" id="propCol">
      <h3>Properti</h3>
      <div id="props"></div>
    </aside>
  </div>
</div>
<div id="scrim" class="scrim" hidden></div>

<script>
"use strict";
var $=function(s,r){return (r||document).querySelector(s)};
var ASSET_BASE='assets/';
var FONTS={display:"'Cormorant Garamond',Georgia,serif",name:"'Cormorant','Cormorant Garamond',serif",body:"'Cormorant Garamond',Georgia,serif"};
var ASSETS=[
 {k:'arch-left',label:'Gapura Kiri',w:44},{k:'arch-right',label:'Gapura Kanan',w:44},
 {k:'gunungan',label:'Gunungan',w:28},{k:'wayang',label:'Wayang',w:24},
 {k:'joglo',label:'Joglo',w:50},{k:'mountain',label:'Merapi',w:46},{k:'temple',label:'Prambanan',w:34},
 {k:'peony-corner',label:'Bunga Sudut',w:48},{k:'spray',label:'Rangkaian',w:40},{k:'hang-bouquet',label:'Untaian',w:40},
 {k:'lotus',label:'Lotus',w:24},{k:'cloud-1',label:'Awan 1',w:28},{k:'cloud-2',label:'Awan 2',w:30},{k:'cloud-3',label:'Awan 3',w:26},
 {k:'diamond',label:'Rozet',w:18},{k:'divider-orn',label:'Divider',w:36},{k:'line',label:'Garis',w:40}
];
var uid=function(){return 'l'+Math.random().toString(36).slice(2,8)};
function img(k,left,top,w,extra){return Object.assign({id:uid(),type:'image',src:k,left:left,top:top,w:w,rot:0,opacity:1,flip:false,tier:0},extra||{})}
function txt(t,left,top,w,o){return Object.assign({id:uid(),type:'text',text:t,left:left,top:top,w:w,rot:0,opacity:1,font:'body',size:16,color:'#35241A',align:'center',italic:false,weight:500,letter:0,pill:false,upper:false,tier:1},o||{})}

function defaultState(){
 return {i:0,sections:[
  {id:'cover',name:'Cover',bg:'#F6ECD9',h:760,layers:[
    img('mountain',24,57.6,45),img('temple',67,64.8,32),img('gunungan',-5,68.8,28),
    img('joglo',28,73.9,50),img('wayang',12,76.6,24),
    img('peony-corner',-11,82.7,50),img('peony-corner',65,84.3,46,{flip:true}),
    img('lotus',37.5,88.3,25),
    img('arch-left',-3.6,-1.8,44),img('arch-right',52.4,-1.8,44),
    txt('THE WEDDING OF',10,21,80,{font:'display',size:12,color:'#935F14',letter:4,upper:true,weight:500}),
    txt('Sekar & Bagas',8,25,84,{font:'name',size:44,color:'#6B1E23',upper:true,weight:500}),
    txt('Katur dhumateng',12,40.5,76,{font:'body',size:17,color:'#6B5236'}),
    txt('Bapak Dimas Anggara',10,44.5,80,{font:'name',size:22,color:'#35241A',weight:500}),
    txt('Bikak Undangan',28,55,44,{font:'display',size:12,color:'#F4E9D5',letter:2,upper:true,pill:true})
  ]},
  {id:'mempelai',name:'Mempelai',bg:'#FBF3E2',h:560,layers:[
    img('divider-orn',32,10,36),
    txt('Sang Penganten',10,18,80,{font:'name',size:30,color:'#6B1E23',weight:500}),
    txt('Sekar Arum',10,40,80,{font:'name',size:26,color:'#6B1E23'}),
    txt('Putri Bapak & Ibu Kusuma',12,50,76,{font:'body',size:15,color:'#6B5236'}),
    txt('Bagas Nugraha',10,64,80,{font:'name',size:26,color:'#6B1E23'}),
    txt('Putra Bapak & Ibu Pratama',12,74,76,{font:'body',size:15,color:'#6B5236'}),
    img('spray',-8,80,42),img('spray',66,82,40,{flip:true})
  ]},
  {id:'acara',name:'Acara',bg:'#F6ECD9',h:600,layers:[
    txt('Rangkaian Adat',10,10,80,{font:'name',size:30,color:'#6B1E23',weight:500}),
    txt('Ijab Kabul · Sabtu, 12 Juni 2027 · 08.00 WIB',12,24,76,{font:'body',size:15,color:'#35241A'}),
    txt('Resepsi · Sabtu, 12 Juni 2027 · 11.00 WIB',12,30,76,{font:'body',size:15,color:'#35241A'}),
    txt('Pendopo Ndalem Ageng, Kraton, Yogyakarta',12,37,76,{font:'body',size:14,color:'#6B5236'}),
    img('joglo',14,50,72),img('mountain',22,46,56,{opacity:.5})
  ]},
  {id:'amplop',name:'Amplop',bg:'#FBF3E2',h:480,layers:[
    img('lotus',38,8,24),
    txt('Amplop Digital',10,24,80,{font:'name',size:30,color:'#6B1E23',weight:500}),
    txt('BCA · 1234567890 · a.n. Bagas Nugraha',12,40,76,{font:'body',size:15,color:'#35241A'}),
    txt('Mandiri · 1234567890123 · a.n. Sekar Arum',12,48,76,{font:'body',size:15,color:'#35241A'}),
    img('peony-corner',-10,70,46),img('peony-corner',64,72,44,{flip:true})
  ]},
  {id:'rsvp',name:'RSVP',bg:'#F6ECD9',h:460,layers:[
    txt('Konfirmasi Rawuh',10,14,80,{font:'name',size:30,color:'#6B1E23',weight:500}),
    txt('Mangga konfirmasi saderengipun 30 Mei 2027',12,28,76,{font:'body',size:15,color:'#6B5236'}),
    img('divider-orn',32,42,36),
    img('spray',-6,66,42),img('spray',64,68,40,{flip:true})
  ]},
  {id:'penutup',name:'Penutup',bg:'#FBF3E2',h:460,layers:[
    img('arch-left',-4,-2,40),img('arch-right',64,-2,40),
    txt('Matur Nuwun',10,40,80,{font:'name',size:34,color:'#6B1E23',weight:500}),
    txt('Sekar & Bagas',10,52,80,{font:'display',size:18,color:'#935F14',letter:3,upper:true}),
    img('lotus',38,66,24)
  ]}
 ]};
}

var S, sel=null, scale=1;
function load(){ try{var r=localStorage.getItem('ivite_editor_v1'); if(r){S=JSON.parse(r); return;}}catch(e){} S=defaultState(); }
function save(){ try{localStorage.setItem('ivite_editor_v1',JSON.stringify(S));}catch(e){} }
function cur(){return S.sections[S.i]}

/* ---------- render ---------- */
function renderTabs(){
 var t=$('#tabs'); t.innerHTML='';
 S.sections.forEach(function(s,ix){
   var b=document.createElement('button'); b.className='tab'+(ix===S.i?' on':''); b.textContent=s.name;
   b.onclick=function(){S.i=ix; sel=null; renderAll();};
   t.appendChild(b);
 });
}
function renderPalette(){
 var p=$('#pal'); p.innerHTML='';
 var at=document.createElement('button'); at.className='addtext'; at.innerHTML='<b>+</b> Tambah Teks';
 at.onclick=function(){addText();}; p.appendChild(at);
 ASSETS.forEach(function(a){
   var b=document.createElement('button'); b.title=a.label;
   b.innerHTML='<img src="'+ASSET_BASE+a.k+'.webp" alt=""><span>'+a.label+'</span>';
   b.onclick=function(){addImage(a);}; p.appendChild(b);
 });
}
function layerStyle(l){
 var s='left:'+l.left+'%;top:'+l.top+'%;width:'+l.w+'%;opacity:'+l.opacity+';transform:rotate('+(l.rot||0)+'deg);';
 return s;
}
function sortedLayers(sec){return sec.layers.map(function(l,i){return [l,i];}).sort(function(a,b){return ((a[0].tier||0)-(b[0].tier||0))||(a[1]-b[1]);}).map(function(p){return p[0];});}
function buildLayerEl(l){
 var el=document.createElement('div'); el.className='layer'+(l.flip?' flip':''); el.style.cssText=layerStyle(l); el.dataset.id=l.id;
 if(l.type==='image'){
   var im=document.createElement('img'); im.src=ASSET_BASE+l.src+'.webp'; im.alt=''; el.appendChild(im);
 } else {
   el.classList.add('ltext'); if(l.pill)el.classList.add('pill');
   el.style.fontFamily=FONTS[l.font]||FONTS.body; el.style.fontSize=l.size+'px'; el.style.color=l.color;
   el.style.textAlign=l.align; el.style.fontStyle=l.italic?'italic':'normal'; el.style.fontWeight=l.weight;
   el.style.letterSpacing=(l.letter||0)/100+'em'; el.style.textTransform=l.upper?'uppercase':'none';
   el.textContent=l.text;
 }
 return el;
}
function renderStage(){
 var sec=cur(); var st=$('#stage'); st.innerHTML='';
 var box=document.createElement('div'); box.className='sec'; box.style.height=sec.h+'px'; box.style.background=sec.bg;
 sortedLayers(sec).forEach(function(l){
   var el=buildLayerEl(l);
   if(sel===l.id){ el.classList.add('sel');
     if(!document.body.classList.contains('previewing')){ var h=document.createElement('div'); h.className='handle'; h.dataset.resize='1'; el.appendChild(h); }
   }
   box.appendChild(el);
 });
 st.appendChild(box); fit();
}
function fit(){
 var wrap=$('#stagewrap'); var avail=wrap.clientWidth-32;
 scale=Math.min(1, avail/390); if(scale<0.2)scale=0.2;
 $('#stage').style.transform='scale('+scale+')';
 $('#stage').style.height=(cur().h*scale)+'px';
}
function renderProps(){
 var p=$('#props'); var sec=cur();
 var l=sel?sec.layers.find(function(x){return x.id===sel}):null;
 if(!l){ p.innerHTML='<div class="empty">Pilih elemen di kanvas untuk mengatur posisi, ukuran, lapisan, atau teksnya.<br><br>Elemen di seksi <b>'+sec.name+'</b>: '+sec.layers.length+'.</div>'; return; }
 var html='';
 if(l.type==='text'){
   html+='<div class="row"><label>Teks</label></div><textarea id="pText">'+esc(l.text)+'</textarea>';
   html+='<div class="row"><label>Font</label><select id="pFont"><option value="name">Cormorant (display)</option><option value="display">Garamond</option><option value="body">Garamond (teks)</option></select></div>';
   html+='<div class="row"><label>Ukuran</label><input type="number" id="pSize" value="'+l.size+'" min="8" max="90"></div>';
   html+='<div class="row"><label>Warna</label><input type="color" id="pColor" value="'+l.color+'"></div>';
   html+='<div class="row"><label>Rata</label><div class="seg" id="pAlign"><button data-v="left">Kiri</button><button data-v="center">Tengah</button><button data-v="right">Kanan</button></div></div>';
   html+='<div class="row"><label>Gaya</label><div class="seg"><button id="pItalic">Italic</button><button id="pUpper">KAPITAL</button><button id="pPill">Pill</button></div></div>';
   html+='<div class="row"><label>Spasi</label><input type="range" id="pLetter" min="0" max="40" value="'+(l.letter||0)+'"></div>';
 }
 html+='<div class="row"><label>Lebar %</label><input type="number" id="pW" value="'+round(l.w)+'" min="2" max="140" step="1"></div>';
 html+='<div class="row"><label>X %</label><input type="number" id="pX" value="'+round(l.left)+'" step="1"></div>';
 html+='<div class="row"><label>Y %</label><input type="number" id="pY" value="'+round(l.top)+'" step="1"></div>';
 html+='<div class="row"><label>Putar</label><input type="range" id="pRot" min="-180" max="180" value="'+(l.rot||0)+'"></div>';
 html+='<div class="row"><label>Opasitas</label><input type="range" id="pOp" min="0" max="100" value="'+Math.round(l.opacity*100)+'"></div>';
 if(l.type==='image'){ html+='<div class="row"><label>Cermin</label><div class="seg"><button id="pFlip">'+(l.flip?'✓ ':'')+'Balik Horizontal</button></div></div>'; }
 html+='<div class="row"><label>Lapis</label><div class="seg" id="pTier"><button data-v="0">Belakang</button><button data-v="1">Depan</button></div></div>';
 html+='<h3 style="margin-left:0">Urutan</h3><div class="zbtns"><button class="btn sm" id="zFront">Ke Depan</button><button class="btn sm" id="zBack">Ke Belakang</button><button class="btn sm" id="zUp">Naik</button><button class="btn sm" id="zDown">Turun</button></div>';
 html+='<div class="row" style="margin-top:12px"><button class="btn sm" id="dup">Gandakan</button><button class="btn sm danger" id="del">Hapus</button></div>';
 p.innerHTML=html;
 bindProps(l);
}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function round(n){return Math.round(n*10)/10}

function bindProps(l){
 function upd(k,v){l[k]=v; renderStage(); save();}
 if(l.type==='text'){
   $('#pText').oninput=function(){l.text=this.value; renderStage(); save();};
   var f=$('#pFont'); f.value=l.font; f.onchange=function(){upd('font',this.value);};
   $('#pSize').oninput=function(){upd('size',+this.value||16);};
   $('#pColor').oninput=function(){upd('color',this.value);};
   var al=$('#pAlign'); al.querySelectorAll('button').forEach(function(b){ if(b.dataset.v===l.align)b.classList.add('on'); b.onclick=function(){l.align=b.dataset.v; renderStage(); renderProps(); save();};});
   $('#pItalic').classList.toggle('on',l.italic); $('#pItalic').onclick=function(){l.italic=!l.italic; renderStage(); renderProps(); save();};
   $('#pUpper').classList.toggle('on',l.upper); $('#pUpper').onclick=function(){l.upper=!l.upper; renderStage(); renderProps(); save();};
   $('#pPill').classList.toggle('on',l.pill); $('#pPill').onclick=function(){l.pill=!l.pill; renderStage(); renderProps(); save();};
   $('#pLetter').oninput=function(){upd('letter',+this.value);};
 }
 $('#pW').oninput=function(){upd('w',+this.value||10);};
 $('#pX').oninput=function(){upd('left',+this.value);};
 $('#pY').oninput=function(){upd('top',+this.value);};
 $('#pRot').oninput=function(){upd('rot',+this.value);};
 $('#pOp').oninput=function(){upd('opacity',(+this.value)/100);};
 if($('#pFlip'))$('#pFlip').onclick=function(){l.flip=!l.flip; renderStage(); renderProps(); save();};
 var tg=$('#pTier'); if(tg){tg.querySelectorAll('button').forEach(function(b){ if((+b.dataset.v)===(l.tier||0))b.classList.add('on'); b.onclick=function(){l.tier=+b.dataset.v; renderStage(); renderProps(); save();};});}
 var sec=cur(), A=sec.layers, i=A.indexOf(l);
 $('#zFront').onclick=function(){A.splice(i,1);A.push(l);renderStage();save();};
 $('#zBack').onclick=function(){A.splice(i,1);A.unshift(l);renderStage();save();};
 $('#zUp').onclick=function(){if(i<A.length-1){A.splice(i,1);A.splice(i+1,0,l);renderStage();save();}};
 $('#zDown').onclick=function(){if(i>0){A.splice(i,1);A.splice(i-1,0,l);renderStage();save();}};
 $('#dup').onclick=function(){var c=JSON.parse(JSON.stringify(l));c.id=uid();c.left+=4;c.top+=4;A.push(c);sel=c.id;renderStage();renderProps();save();};
 $('#del').onclick=function(){A.splice(i,1);sel=null;renderStage();renderProps();save();};
}

function addImage(a){ var l=img(a.k,28,40,a.w); cur().layers.push(l); sel=l.id; renderStage(); renderProps(); save(); }
function addText(){ var l=txt('Teks baru',20,40,60,{font:'name',size:24,color:'#6B1E23'}); cur().layers.push(l); sel=l.id; renderStage(); renderProps(); save(); closeDrawers(); }

/* ---------- drag / resize ---------- */
var drag=null;
$('#stage').addEventListener('pointerdown',function(e){
 if(document.body.classList.contains('previewing'))return;
 var le=e.target.closest('.layer'); if(!le){return;}
 var id=le.dataset.id; sel=id; renderProps();
 // re-render to show selection+handle, then rebind target
 renderStage();
 var l=cur().layers.find(function(x){return x.id===id});
 var secEl=$('.sec'); var rect=secEl.getBoundingClientRect();
 var resizing=e.target.dataset && e.target.dataset.resize==='1';
 // if clicked the (old) handle position, detect by proximity after rerender:
 drag={l:l,resizing:resizing,startX:e.clientX,startY:e.clientY,oLeft:l.left,oTop:l.top,oW:l.w,rect:rect};
 try{$('#stage').setPointerCapture(e.pointerId);}catch(_){}
 e.preventDefault();
},true);
$('#stage').addEventListener('pointermove',function(e){
 if(!drag)return;
 var dx=(e.clientX-drag.startX)/scale, dy=(e.clientY-drag.startY)/scale;
 var secW=390, secH=cur().h;
 if(drag.resizing){
   var nw=drag.oW + dx/secW*100; if(nw<2)nw=2; drag.l.w=nw;
 } else {
   drag.l.left=drag.oLeft + dx/secW*100;
   drag.l.top=drag.oTop + dy/secH*100;
 }
 renderStage();
});
function endDrag(e){ if(drag){drag=null; renderProps(); save();} }
$('#stage').addEventListener('pointerup',endDrag);
$('#stage').addEventListener('pointercancel',endDrag);

/* double click text to edit quickly */
$('#stage').addEventListener('dblclick',function(e){
 var le=e.target.closest('.layer'); if(!le)return; var l=cur().layers.find(function(x){return x.id===le.dataset.id});
 if(l&&l.type==='text'){var t=prompt('Edit teks:',l.text); if(t!==null){l.text=t;renderStage();renderProps();save();}}
});

/* ---------- section controls ---------- */
$('#secBg').oninput=function(){cur().bg=this.value;renderStage();save();};
$('#secH').oninput=function(){cur().h=+this.value||500;renderStage();save();};
$('#secAdd').onclick=function(){var n=prompt('Nama seksi baru:','Seksi '+(S.sections.length+1));if(n===null)return;S.sections.push({id:uid(),name:n,bg:'#F6ECD9',h:480,layers:[]});S.i=S.sections.length-1;sel=null;renderAll();};
$('#secDel').onclick=function(){if(S.sections.length<=1){return;} if(!confirmBox('Hapus seksi "'+cur().name+'"?'))return; S.sections.splice(S.i,1); S.i=Math.max(0,S.i-1); sel=null; renderAll();};
function confirmBox(m){ // confirm() returns false in artifact; use simple inline window? fallback true
 return window.confirm?window.confirm(m):true;
}

/* ---------- preview ---------- */
$('#btnPreview').onclick=function(){ document.body.classList.toggle('previewing'); var on=document.body.classList.contains('previewing'); this.textContent=on?'Edit':'Pratinjau'; sel=on?null:sel; renderStage(); renderProps(); };

$('#btnJson').onclick=function(){ openJson(); };

/* ---------- render undangan nyata (layout → undangan) ---------- */
$('#btnInvite').onclick=function(){ enterInvite(); };
function enterInvite(){
 exitInvite();
 var ov=document.createElement('div'); ov.id='invite';
 var wrap=document.createElement('div'); wrap.className='wrap'; ov.appendChild(wrap);
 var sv=Math.min(480,window.innerWidth)/390;
 S.sections.forEach(function(sec){
   var w=document.createElement('div'); w.className='rsec';
   w.style.width=(390*sv)+'px'; w.style.height=(sec.h*sv)+'px'; w.style.background=sec.bg;
   var st=document.createElement('div'); st.className='rstage'; st.style.transform='scale('+sv+')'; st.style.height=sec.h+'px';
   sortedLayers(sec).forEach(function(l){ st.appendChild(buildLayerEl(l)); });
   w.appendChild(st); wrap.appendChild(w);
 });
 var eb=document.createElement('button'); eb.className='btn invedit'; eb.textContent='Edit'; eb.onclick=exitInvite; ov.appendChild(eb);
 document.body.appendChild(ov); ov.scrollTop=0;
 ov.querySelectorAll('.ltext.pill').forEach(function(p){ p.style.cursor='pointer'; p.addEventListener('click',function(){ var secs=ov.querySelectorAll('.rsec'); if(secs[1])secs[1].scrollIntoView({behavior:'smooth'}); }); });
 document.addEventListener('keydown',escInvite);
}
function exitInvite(){ var ov=document.getElementById('invite'); if(ov)ov.remove(); document.removeEventListener('keydown',escInvite); }
function escInvite(e){ if(e.key==='Escape')exitInvite(); }
function openJson(){
 var m=document.createElement('div'); m.className='modal';
 m.innerHTML='<div class="box"><h2>Layout (JSON)</h2><p style="margin:0;color:var(--muted);font-size:12px">Salin untuk menyimpan/berbagi, atau tempel JSON lalu Muat untuk memulihkan.</p><textarea id="jsonArea"></textarea><div class="acts"><button class="btn" id="jClose">Tutup</button><button class="btn" id="jLoad">Muat dari teks</button><button class="btn primary" id="jCopy">Salin</button></div></div>';
 document.body.appendChild(m);
 var ta=$('#jsonArea',m); ta.value=JSON.stringify(S,null,2);
 $('#jClose',m).onclick=function(){m.remove();};
 $('#jCopy',m).onclick=function(){ta.select(); try{navigator.clipboard.writeText(ta.value).then(function(){this&&0},function(){});}catch(e){} try{document.execCommand('copy');}catch(e){} this.textContent='Tersalin ✓'; var b=this; setTimeout(function(){b.textContent='Salin';},1500);};
 $('#jLoad',m).onclick=function(){ try{var o=JSON.parse(ta.value); if(o&&o.sections){S=o;S.i=Math.min(S.i||0,S.sections.length-1);sel=null;save();renderAll();m.remove();}}catch(e){alert('JSON tidak valid.');} };
 m.addEventListener('click',function(e){if(e.target===m)m.remove();});
}

/* ---------- mobile drawers ---------- */
function openDrawer(side){ $('#'+(side==='left'?'palCol':'propCol')).classList.add('open'); $('#scrim').hidden=false; }
function closeDrawers(){ $('#palCol').classList.remove('open'); $('#propCol').classList.remove('open'); $('#scrim').hidden=true; }
$('#mPal').onclick=function(){openDrawer('left');};
$('#mProp').onclick=function(){openDrawer('right');};
$('#scrim').onclick=closeDrawers;

/* ---------- init ---------- */
function syncSectionInputs(){ $('#secBg').value=cur().bg; $('#secH').value=cur().h; }
function renderAll(){ renderTabs(); syncSectionInputs(); renderStage(); renderProps(); }
window.addEventListener('resize',function(){fit();});
load(); renderPalette(); renderAll();
</script>
