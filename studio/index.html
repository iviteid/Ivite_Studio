<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ivite Studio · Invitation design workspace</title><meta name="description" content="Mix artwork, edit every word, fine-tune colors and typography, and export your own invitation."><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600&display=swap"><link rel="stylesheet" href="studio.css?v=13"></head>
<body>
<header class="top"><a class="brand" href="./">ivite<span>STUDIO</span></a><span class="top-divider"></span><input id="design-name" aria-label="Design name" value="Untitled invitation" maxlength="80"><span id="save-status" role="status">Opening workspace…</span><div class="top-actions"><button class="btn" id="library">My designs</button><button class="btn" id="import">Import</button><button class="btn primary" id="export">Export invitation ↗</button></div></header>
<main class="workspace"><aside class="rail"><span class="rail-kicker">WORKSPACE</span><nav id="tabs" aria-label="Design tools"></nav><div class="rail-note"><i class="local-dot"></i> Made on your device<small>Your designs stay in this browser.</small></div></aside><aside class="panel"><div class="panel-heading"><p class="eyebrow" id="panel-kicker">THE STARTING POINT</p><h1 id="panel-title">Design collection</h1><p id="panel-description">A little tradition. Entirely your own.</p></div><div id="panes"></div></aside>
<section class="canvas" aria-label="Invitation preview"><div class="canvas-toolbar"><div class="preview-controls"><button class="icon-btn" id="undo" aria-label="Undo">↶</button><button class="icon-btn" id="redo" aria-label="Redo">↷</button><span class="preview-label">LIVE PREVIEW</span></div><div class="view-modes"><button class="on" data-width="390">Mobile</button><button data-width="720">Wide</button></div><button class="btn canvas-toggle" id="toggle-prev">Back to editor</button></div><div class="preview-navigation"><label for="preview-section">Viewing</label><select id="preview-section"><option value="cover">Cover</option><option value="hero">Opening</option><option value="blessing">Welcome</option><option value="couple">The couple</option><option value="story">Our story</option><option value="event">The event</option><option value="gallery">Gallery</option><option value="gift">Wedding gift</option><option value="rsvp">RSVP</option><option value="closing">Closing</option></select><button id="play-preview" class="text-btn">Play invitation ▷</button><button id="restart-preview" class="text-btn">Restart ↺</button></div><div class="preview-scroll"><div class="preview-fit" id="preview-fit"><div class="device" id="device"><iframe id="frame" title="Live invitation preview" src="about:blank"></iframe></div></div></div><footer class="canvas-footer"><span><i class="local-dot"></i> Changes appear as you edit</span><span id="canvas-size">390 × 780 · 9:18</span></footer></section></main>
<button class="mobile-preview-btn" id="mobile-preview">Preview invitation ↗</button><div class="modal" id="modal" hidden><section class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title"></h2><button class="icon-btn" id="modal-close" aria-label="Close dialog">×</button></div><div id="modal-body"></div></section></div><div id="toast" role="status" hidden></div><input type="file" id="import-file" accept=".json,application/json" hidden><script src="config.js?v=7"></script><script src="animation-engine.js?v=4"></script><script src="gusti-zidni.js?v=1"></script><script src="rominadia.js?v=8"></script><script src="claralxa.js?v=1"></script><script src="andika-putri.js?v=1"></script><script src="collection-designs.js?v=10"></script><script src="studio.js?v=27"></script></body></html>
